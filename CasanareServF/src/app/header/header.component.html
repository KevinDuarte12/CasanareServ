<!-- Contenedor principal fluido que ocupa todo el ancho disponible -->
<div class="container-fluid">
    <!-- Primera fila con fondo gris (bg-secondary) y padding en los ejes X y Y -->
    <div class="row bg-secondary py-1 px-xl-5">
        <!-- Columna izquierda que ocupa 6 columnas en pantallas grandes, oculta en móviles -->
        <div class="col-lg-6 d-none d-lg-block">
            <!-- Contenedor flexible para alinear elementos horizontalmente -->
            <div class="d-inline-flex align-items-center h-100">
                <!-- Enlaces de navegación con margen derecho y color de texto heredado -->
                <a class="text-body mr-3" routerLink="/about">About</a>
                <a class="text-body mr-3" routerLink="/contact">Contact</a>
                <a class="text-body mr-3" routerLink="/shipment-tracking">Help</a>
                <a class="text-body mr-3"  routerLink="/faq">FAQs</a>
                <a class="text-body mr-3"  routerLink="/dashboard">Dashboard</a>
            </div>
        </div>

        <!-- Columna derecha alineada al centro en móviles y a la derecha en desktop -->
        <div class="col-lg-6 text-center text-lg-right">
            <!-- Grupo de botones para cuenta, moneda e idioma -->
            <div class="d-inline-flex align-items-center">
                <!-- Dropdown de cuenta de usuario -->
                <div class="btn-group">
                    <!-- Botón que activa el dropdown -->
                    <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown">My Account</button>
                    <!-- Menú desplegable con opciones de inicio/registro -->
                    <div class="dropdown-menu dropdown-menu-right">
                        <button routerLink="/loggin" class="dropdown-item" type="button">Sign in</button>
                        <button routerLink="/registro" class="dropdown-item" type="button">Sign up</button>
                    </div>
                </div>

                <!-- Dropdown de selección de moneda con margen en X -->
                <div class="btn-group mx-2">
                    <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown">USD</button>
                    <div class="dropdown-menu dropdown-menu-right">
                        <button class="dropdown-item" type="button">EUR</button>
                        <button class="dropdown-item" type="button">GBP</button>
                        <button class="dropdown-item" type="button">CAD</button>
                    </div>
                </div>

                <!-- Dropdown de selección de idioma -->
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown">EN</button>
                    <div class="dropdown-menu dropdown-menu-right">
                        <button class="dropdown-item" type="button">FR</button>
                        <button class="dropdown-item" type="button">AR</button>
                        <button class="dropdown-item" type="button">RU</button>
                    </div>
                </div>
            </div>

            <!-- Iconos de favoritos y carrito solo visibles en móviles -->
            <div class="d-inline-flex align-items-center d-block d-lg-none">
                <!-- Botón de favoritos con contador -->
                <a href="" class="btn px-0 ml-2">
                    <i class="fas fa-heart text-dark"></i>
                    <span class="badge text-dark border border-dark rounded-circle" style="padding-bottom: 2px;">0</span>
                </a>
                <!-- Botón de carrito con contador -->
                <a href="" class="btn px-0 ml-2">
                    <i class="fas fa-shopping-cart text-dark"></i>
                    <span class="badge text-dark border border-dark rounded-circle" style="padding-bottom: 2px;">0</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Segunda fila con logo, buscador y contacto (visible solo en desktop) -->
    <div class="row align-items-center bg-light py-3 px-xl-5 d-none d-lg-flex">
        <!-- Columna del logo -->
        <div class="col-lg-4">
            <a routerLink="/"><img src="img/logo1.png" alt="Logo de la pagina" width="120px" height="100px" class="header-logo"></a>
            <!-- <a href="" class="text-decoration-none">
                <span class="h1 text-uppercase text-primary bg-dark px-2">Casanare</span>
                <span class="h1 text-uppercase text-dark bg-primary px-2 ml-n1">Serv</span>
            </a> -->
        </div>

        <!-- Columna del buscador -->
        <div class="col-lg-4 col-6 text-left">
            <form action="">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Buscar productos">
                    <div class="input-group-append">
                        <span class="input-group-text bg-transparent text-primary">
                            <i class="fa fa-search"></i>
                        </span>
                    </div>
                </div>
            </form>
        </div>

        <!-- Columna de información de contacto -->
        <div class="col-lg-4 col-6 text-right">
            <p class="m-0">Servicio al cliente</p>
            <h5 class="m-0">+57 311-576-6179</h5>
        </div>
    </div>
</div>

<!-- Router outlet para la navegación (debería removerse del header) -->
<router-outlet></router-outlet>

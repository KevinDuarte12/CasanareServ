<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-container">
    <div class="form-card">
      <div class="form-header">
        <h2 class="form-title">{{ productId ? 'Editar Producto' : 'Nuevo Producto' }}</h2>
        <button class="close-button" (click)="cancel()">×</button>
      </div>
      
      <form (ngSubmit)="onSubmit()" #productForm="ngForm">
        <div class="input-group">
          <label for="name" class="form-label">Nombre del Producto</label>
          <input 
              type="text" 
              id="name" 
              name="name" 
              [(ngModel)]="productData.name"
              required
              minlength="3"
              class="form-input"
              #nameField="ngModel"
          >
          <div *ngIf="nameField.invalid && (nameField.dirty || nameField.touched)" class="form-error">
              <div *ngIf="nameField.errors?.['required']">El nombre es obligatorio.</div>
              <div *ngIf="nameField.errors?.['minlength']">El nombre debe tener al menos 3 caracteres.</div>
          </div>
        </div>

        <div class="input-group">
          <label for="category" class="form-label">Categoría</label>
          <select 
              id="category" 
              name="id_category" 
              [(ngModel)]="productData.id_category"
              required
              class="form-input"
              #categoryField="ngModel"
          >
              <option [ngValue]="0" disabled>Seleccionar categoría</option>
              <option *ngFor="let category of categories" [value]="category.id_category">
                  {{ category.name }}
              </option>
          </select>
          <div *ngIf="categoryField.invalid && (categoryField.dirty || categoryField.touched)" class="form-error">
              <div *ngIf="categoryField.errors?.['required']">Seleccione una categoría.</div>
          </div>
        </div>

        <div class="input-group">
          <label for="description" class="form-label">Descripción</label>
          <textarea 
              id="description" 
              name="description" 
              [(ngModel)]="productData.description"
              class="form-input"
              rows="3"
          ></textarea>
        </div>

        <div class="input-group">
          <label for="price" class="form-label">Precio</label>
          <input 
              type="number" 
              id="price" 
              name="price" 
              [(ngModel)]="productData.price"
              required
              min="0"
              step="0.01"
              class="form-input"
              #priceField="ngModel"
          >
          <div *ngIf="priceField.invalid && (priceField.dirty || priceField.touched)" class="form-error">
              <div *ngIf="priceField.errors?.['required']">El precio es obligatorio.</div>
              <div *ngIf="priceField.errors?.['min']">El precio no puede ser negativo.</div>
          </div>
        </div>

        <div class="input-group">
          <label for="stock" class="form-label">Stock disponible</label>
          <input 
              type="number" 
              id="stock" 
              name="stock" 
              [(ngModel)]="productData.stock"
              required
              min="0"
              class="form-input"
              #stockField="ngModel"
          >
          <div *ngIf="stockField.invalid && (stockField.dirty || stockField.touched)" class="form-error">
              <div *ngIf="stockField.errors?.['required']">El stock es obligatorio.</div>
              <div *ngIf="stockField.errors?.['min']">El stock no puede ser negativo.</div>
          </div>
        </div>
        
        <div class="input-group" *ngIf="productId">
          <label for="status" class="form-label">Estado</label>
          <select 
              id="status" 
              name="status" 
              [(ngModel)]="productData.status"
              class="form-input"
          >
              <option value="disponible">Disponible</option>
              <option value="vendido">Vendido</option>
              <option value="en_trueque">En trueque</option>
          </select>
        </div>

        <div class="input-group">
          <div class="checkbox-container">
            <input 
                type="checkbox" 
                id="permite_trueque" 
                name="permite_trueque" 
                [(ngModel)]="productData.permite_trueque"
                class="form-checkbox"
            >
            <label for="permite_trueque" class="form-label">Permite trueque</label>
          </div>
        </div>

        <div class="button-container">
          <button type="button" (click)="cancel()" class="btn btn-cancel">
            Cancelar
          </button>
          <button type="submit" [disabled]="productForm.invalid || isSaving" class="btn btn-save"
            [class.btn-loading]="isSaving">
            {{ isSaving ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

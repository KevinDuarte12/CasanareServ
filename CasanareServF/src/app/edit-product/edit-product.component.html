<div class="modal-overlay" *ngIf="isOpen" (click)="closeModal(false)">
  <div class="modal-container" #productForm (click)="onFormClick($event)">
    <div class="form-card">
      <!-- Cabecera del formulario -->
      <div class="form-header">
        <h2 class="form-title">{{ productId ? 'Editar Producto' : 'Nuevo Producto' }}</h2>
        <button class="close-button" (click)="cancel()">×</button>
      </div>

      <!-- Indicador de carga -->
      <div *ngIf="loading" class="text-center py-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando datos...</p>
      </div>

      <!-- Formulario -->
      <form *ngIf="!loading" (ngSubmit)="$event.preventDefault(); onSubmit()">
        <!-- Nombre del producto -->
        <div class="input-group">
          <label for="productName" class="form-label">Nombre del producto *</label>
          <input 
            type="text" 
            class="form-input" 
            id="productName" 
            name="name" 
            [(ngModel)]="productData.name" 
            required
            placeholder="Ingrese el nombre del producto"
          >
        </div>

        <!-- Categoría -->
        <div class="input-group">
          <label for="category" class="form-label">Categoría *</label>
          <select 
            class="form-input" 
            id="category" 
            name="id_category" 
            [(ngModel)]="productData.id_category" 
            required
          >
            <option value="" disabled selected>Seleccione una categoría</option>
            <option *ngFor="let cat of categories" [value]="cat.id_category">{{ cat.name }}</option>
          </select>
        </div>

        <!-- Precio -->
        <div class="input-group">
          <label for="price" class="form-label">Precio *</label>
          
          <div class="price-input-group">
            <input             
              type="number" 
              class="form-input price-input" 
              id="price" 
              name="price" 
              [(ngModel)]="productData.price" 
              required
              min="0"
              placeholder="$ 0.00"
            >
          </div>
        </div>

        <!-- Stock -->
        <div class="input-group">
          <label for="stock" class="form-label">Stock disponible *</label>
          <input 
            type="number" 
            class="form-input" 
            id="stock" 
            name="stock" 
            [(ngModel)]="productData.stock" 
            required
            min="0"
            placeholder="Cantidad disponible"
          >
        </div>

        <!-- Descripción -->
        <div class="input-group">
          <label for="description" class="form-label">Descripción</label>
          <textarea 
            class="form-input" 
            id="description" 
            name="description" 
            [(ngModel)]="productData.description" 
            rows="4"
            placeholder="Describe tu producto..."
          ></textarea>
        </div>

        <!-- Sección de carga de imágenes -->
        <div class="form-group mt-3">
          <label>Imágenes del producto *</label>
          
          <!-- Previsualización de imágenes seleccionadas -->
          <div class="image-preview-container" *ngIf="selectedImagePreviews.length > 0">
            <div *ngFor="let preview of selectedImagePreviews; let i = index" 
                 class="image-preview-item"
                 [class.main-image]="i === mainImageIndex">
              <img [src]="preview" alt="Vista previa" loading="lazy">
              <div class="image-actions">
                <button type="button" class="btn btn-sm" 
                        [class.btn-primary]="i === mainImageIndex"
                        [class.btn-outline-light]="i !== mainImageIndex"
                        (click)="setMainImage(i)"
                        [title]="i === mainImageIndex ? 'Imagen principal' : 'Establecer como imagen principal'">
                  <i class="fas fa-star"></i>
                </button>
                <button type="button" class="btn btn-sm btn-danger" 
                        (click)="removeSelectedImage(i)"
                        title="Eliminar imagen">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
          </div>
          
          <!-- Input para subir imágenes (oculto) -->
          <input type="file" #fileInput style="display: none"
                 accept="image/*" multiple
                 (change)="onFilesSelected($event)">
          
          <!-- Botón para activar el selector de archivos -->
          <div class="mt-2">
            <button type="button" class="btn btn-outline-primary me-2"
                    [disabled]="selectedImagePreviews.length >= maxImages || isUploading"
                    (click)="fileInput.click()">
              <i class="fas fa-image me-1"></i>
              Añadir imágenes
            </button>
            <small class="text-muted ms-2">
              {{ selectedImagePreviews.length }}/{{ maxImages }} imágenes seleccionadas
            </small>
          </div>
          
          <!-- Indicador de carga -->
          <div *ngIf="isUploading" class="upload-progress mt-2">
            <div class="spinner-border spinner-border-sm text-primary"></div>
            <span class="ms-2">Subiendo imágenes...</span>
          </div>
        </div>

        <!-- Botones de acción -->
        <div class="form-actions mt-4">
          <button type="button" class="btn btn-secondary me-2" (click)="cancel()" [disabled]="isSaving">
            Cancelar
          </button>
          
          <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="isSaving">
            {{ isSaving ? 'Guardando...' : (productId ? 'Actualizar' : 'Crear') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

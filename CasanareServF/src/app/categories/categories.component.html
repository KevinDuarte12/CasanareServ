<!-- Inicio de la sección de categorías -->
<div class="container-fluid pt-5">
    <h2 class="section-title position-relative text-uppercase mx-xl-5 mb-4"><span class="bg-secondary pr-3">Categorias</span></h2>
    
    <!-- Spinner de carga -->
    <div *ngIf="loading" class="row px-xl-5 pb-3">
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Cargando...</span>
            </div>
        </div>
    </div>
    
    <div *ngIf="!loading" class="row px-xl-5 pb-3">
        <!-- Recorremos las categorías dinámicamente (máximo 12) -->
        <div class="col-lg-3 col-md-4 col-sm-6 pb-1" *ngFor="let category of displayedCategories; let i = index">
            <a class="text-decoration-none" 
               [routerLink]="['/shop']" 
               [queryParams]="{category: category.id_category}"
               fragment="top">
                <div class="cat-item img-zoom d-flex align-items-center mb-4">
                    <!-- Contenedor de imagen con mejor manejo de errores -->
                    <div class="overflow-hidden" [class.no-image]="!category.imageUrl">
                        <img class="img-fluid" 
                             [ngClass]="{'img-contain': shouldUseContainClass(category.imageUrl)}"
                             [src]="category.imageUrl || 'assets/img/cat-' + ((i % 4) + 1) + '.jpg'" 
                             alt="{{ category.name }}"
                             (error)="handleImageError($event, i)">
                    </div>
                    <div class="flex-fill pl-3">
                        <!-- Nombre de categoría de la base de datos -->
                        <h6>{{category.name}}</h6>
                        <!-- Cantidad de productos -->
                        <small class="text-body">{{category.productCount || 0}} Productos</small>
                    </div>
                </div>
            </a>
        </div>
        
        <!-- Mensaje si no hay categorías -->
        <div *ngIf="displayedCategories.length === 0" class="col-12 text-center">
            <p>No se encontraron categorías</p>
        </div>
    </div>
</div>
<!-- Fin de la sección de categorías -->

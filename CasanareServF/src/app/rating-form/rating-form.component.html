<div class="rating-form" *ngIf="isAuthenticated">
  <h4>Califica este producto</h4>
  
  <div class="form-group">
    <label>Tu puntuación *</label>
    <div class="d-flex align-items-center">
      <app-star-rating
        [rating]="rating" 
        [readonly]="false"
        (ratingChange)="onRatingChange($event)">
      </app-star-rating>
      <span class="ml-2" *ngIf="rating > 0">{{ rating }} estrella{{ rating !== 1 ? 's' : '' }}</span>
    </div>
  </div>
  
  <div class="form-group">
    <label for="comment">Tu comentario (opcional)</label>
    <textarea 
      id="comment" 
      class="form-control" 
      rows="4" 
      placeholder="Comparte tu experiencia con este producto..."
      [(ngModel)]="comment">
    </textarea>
  </div>
  
  <div class="form-group">
    <button 
      class="btn btn-primary px-3" 
      [disabled]="!rating || isSubmitting" 
      (click)="submitRating()">
      <span *ngIf="isSubmitting">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Enviando...
      </span>
      <span *ngIf="!isSubmitting">Enviar reseña</span>
    </button>
  </div>
</div>

<div class="auth-message" *ngIf="!isAuthenticated">
  <p>Inicia sesión para calificar este producto</p>
  <button class="btn btn-outline-primary" routerLink="/login">Iniciar sesión</button>
</div>

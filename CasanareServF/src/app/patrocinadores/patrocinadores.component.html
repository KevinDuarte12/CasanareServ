<div class="carousel-container">
    <h3><span class="title-patrocinadores">PATROCINADORES</span></h3>
    <div class="custom-carousel" 
         (mouseenter)="stopAutoPlay()" 
         (mouseleave)="startAutoPlay()"
         (touchstart)="onTouchStart($event)"
         (touchmove)="onTouchMove($event)"
         (touchend)="onTouchEnd()"
         (touchcancel)="onTouchEnd()">
        <div class="slides-wrapper">
            <div class="slides-container" #slidesContainer>
                <div class="slide" *ngFor="let slide of slides">
                    <img [src]="slide.image" [alt]="slide.alt" loading="lazy">
                </div>
            </div>
        </div>
        <button class="carousel-control prev" (click)="prevSlide()" aria-label="Anterior">&lt;</button>
        <button class="carousel-control next" (click)="nextSlide()" aria-label="Siguiente">&gt;</button>
    </div>
</div>

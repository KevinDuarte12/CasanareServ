<app-header></app-header>
<app-navbar></app-navbar>

<div class="container py-5">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card mb-4">
        <div class="card-header bg-primary d-flex align-items-center">
          <!-- Añadir la barra inicial para hacer la ruta absoluta -->
          <img [src]="otherUserAvatar || '/img/perfil3.png'" 
               alt="Avatar" 
               class="rounded-circle mr-2" 
               style="width: 40px; height: 40px; object-fit: cover; margin-right: 10px;">
          <h5 class="mb-0 text-white">Chat con {{otherUserName}}</h5>
          <a [routerLink]="['/']" class="btn btn-light btn-sm ml-auto">
            <i class="fa fa-arrow-left mr-1"></i> Volver
          </a>
        </div>
        
        <div class="card-body chat-messages">
          <!-- Mensaje de depuración para confirmar la recepción de datos -->
          <div *ngIf="productId" class="alert alert-info">
            Product ID: {{productId}}
          </div>
          
          <div *ngIf="!messages || messages.length === 0" class="text-center py-4 text-muted">
            No hay mensajes aún. ¡Inicia la conversación!
          </div>
          
          <div *ngFor="let msg of messages" 
               [ngClass]="{'message-sent': msg.id_user === currentUserId, 
                          'message-received': msg.id_user !== currentUserId}"
               class="message-container mb-3">
            <div class="message-bubble">
              <p *ngIf="msg.message" class="mb-1">{{msg.message}}</p>
              <!-- Asegurar que las rutas de imágenes son absolutas -->
              <img *ngIf="msg.image_url" 
                   [src]="msg.image_url.startsWith('http') ? msg.image_url : ('/' + msg.image_url)" 
                   class="img-fluid rounded mb-1">
              <small class="text-muted message-time">
                {{msg.sent_at | date:'short'}}
              </small>
            </div>
          </div>
        </div>
        
        <div class="card-footer">
          <form (ngSubmit)="sendMessage()" class="d-flex">
            <input [(ngModel)]="newMessage" name="message" 
                   class="form-control" placeholder="Escribe un mensaje...">
            <div class="input-group-append ml-2">
              <label class="btn btn-outline-secondary mb-0">
                <i class="fa fa-image"></i>
                <input type="file" (change)="onImageSelected($event)" hidden>
              </label>
              <!-- Añadir disabled si no hay mensaje ni imagen -->
              <button type="submit" class="btn btn-primary ml-2" 
                      [disabled]="!newMessage && !selectedImage">
                <i class="fa fa-paper-plane"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>

<!-- SECCIÓN: Trueques Recientes -->
<div class="container-fluid pt-5 pb-3">
    <!-- Título de la sección -->
    <h2 class="section-title position-relative text-uppercase mx-xl-5 mb-4">
        <span class="bg-secondary pr-3">Trueques Recientes</span>
    </h2>
    <!-- SPINNER: Estado de carga -->
    <div *ngIf="loading" class="row px-xl-5">
        <div class="col-12 d-flex justify-content-center">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Cargando...</span>
            </div>
        </div>
    </div>
    <!-- GRID: Lista de trueques -->
    <div *ngIf="!loading" class="row px-xl-5">
        <!-- Iteración por cada trueque reciente -->
        <div *ngFor="let barter of recentBarters; let i = index" class="col-lg-3 col-md-4 col-sm-6 pb-1">
            <div class="product-item bg-light">
                <!-- IMAGEN: Contenedor con acciones hover -->
                <div class="product-img">
                    <!-- Imagen del producto del trueque con fallback de error -->
                    <img [src]="getBarterImage(barter, i)" 
                         [alt]="barter.product.name"
                         (error)="handleImageError($event, i)">
                    <!-- ACCIONES: Botones de hover -->
                    <div class="product-action">
                        <!-- Botón proponer trueque (icono de dos flechas) -->
                        <a class="btn btn-outline-dark btn-square" href="javascript:void(0)"
                           (click)="proposeBarter(barter); $event.preventDefault(); $event.stopPropagation()"
                           title="Proponer trueque">
                            <i class="fas fa-exchange-alt"></i>
                        </a>
                        <!-- Botón ver detalles del trueque -->
                        <a class="btn btn-outline-dark btn-square" href="javascript:void(0)"
                           (click)="showBarterDetail(barter.id); $event.preventDefault(); $event.stopPropagation()"
                           title="Ver detalles">
                            <i class="fa fa-search"></i>
                        </a>
                    </div>
                </div>
                <!-- INFO: Datos del trueque -->
                <div class="text-center py-4">
                    <!-- Nombre del producto (clickeable para detalles) -->
                    <a class="h6 text-decoration-none text-truncate" href="javascript:void(0)" 
                       (click)="showBarterDetail(barter.id)"
                       title="{{ barter.product.name }}">
                        {{ barter.product.name }}
                    </a>
                    <!-- BADGE: Disponible para trueque (en lugar del precio) -->
                    <div class="d-flex align-items-center justify-content-center mt-2">
                        <span class="badge badge-success px-3 py-2" style="font-size: 0.9em;">
                            <i class="fas fa-exchange-alt mr-1"></i>
                            Disponible para Trueque
                        </span>
                    </div>
                    <!-- RATING: Sistema de estrellas fijo + tipo de intercambio -->
                    <div class="d-flex align-items-center justify-content-center mb-1">
                        <!-- Estrellas decorativas (5 estrellas fijas como productos) -->
                        <small class="fa fa-star text-primary mr-1"></small>
                        <small class="fa fa-star text-primary mr-1"></small>
                        <small class="fa fa-star text-primary mr-1"></small>
                        <small class="fa fa-star text-primary mr-1"></small>
                        <small class="fa fa-star text-primary mr-1"></small>
                        <!-- Tipo de intercambio en lugar de stock -->
                        <small>({{ getExchangeTypeShort(barter.exchange_type) }})</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- MENSAJE: Sin trueques disponibles -->
    <div *ngIf="!loading && recentBarters.length === 0" class="row px-xl-5">
        <div class="col-12 text-center py-5">
            <i class="fas fa-exchange-alt fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">No hay trueques recientes disponibles</h4>
            <p class="text-muted">¡Sé el primero en publicar un trueque!</p>
        </div>
    </div>
</div>

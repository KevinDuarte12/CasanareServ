<body class="dashboard">
    <div class="flex h-screen">
        <!-- Overlay del sidebar -->
        <div class="sidebar-overlay" 
             [class.active]="isSidebarActive" 
             (click)="toggleSidebar()">
        </div>

        <button class="menu-toggle" (click)="toggleSidebar()">
            <i class="fas fa-bars fa-lg"></i>
        </button>

        <!-- Panel de navegación lateral -->
        <aside [class.active]="isSidebarActive">
            <div class="house"><i routerLink="/" class="fa-solid fa-house"></i></div>
            <h2 class="admin">ADMIN</h2>
        
            <ul>
                <li [ngClass]="{'active': activeSection === 'dashboard'}" (click)="showSection('dashboard', $event)">
                    <a><i class="fas fa-tachometer-alt mr-3"></i>Dashboard</a>
                </li>
                <li [ngClass]="{'active': activeSection === 'usuarios'}" (click)="showSection('usuarios', $event)">
                    <a><i class="fas fa-users mr-3"></i>Usuarios</a>
                </li>
                <li [ngClass]="{'active': activeSection === 'categorias'}" (click)="showSection('categorias', $event)">
                    <a><i class="fas fa-tags mr-3"></i>Categorías</a>
                </li>
                <li [ngClass]="{'active': activeSection === 'productos'}" (click)="showSection('productos', $event)">
                    <a><i class="fas fa-box mr-3"></i>Productos</a>
                </li>
                <li [ngClass]="{'active': activeSection === 'trueques'}" (click)="showSection('trueques', $event)">
                    <a><i class="fas fa-exchange-alt mr-3"></i>Trueques</a>
                </li>
            </ul>

            <div class="admin-buttons">
                <button class="exit-admin-btn bg-yellow-500 text-white px-4 py-2 rounded w-full mb-3" (click)="exitAdmin()">
                    <i class="fas fa-sign-out-alt mr-2"></i>Salir del ADMIN
                </button>
                <button class="logout-btn bg-red-500 text-white px-4 py-2 rounded w-full" (click)="logOut()">
                    <i class="fas fa-power-off mr-2"></i>Cerrar sesión
                </button>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main [class.expanded]="isSidebarActive">
            <!-- Sección Dashboard -->
            <div id="dashboard-section" class="dashboard-section" [class.active]="activeSection === 'dashboard'">
                <h1><a name="Dashboard"></a>Dashboard</h1>
                
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-4 rounded shadow">
                        <h3 class="text-lg font-semibold">Usuarios Registrados</h3>
                        <p class="text-2xl font-bold">{{ userCount }}</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <h3 class="text-lg font-semibold">Productos</h3>
                        <p class="text-2xl font-bold">{{ productCount }}</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <h3 class="text-lg font-semibold">Trueques</h3>
                        <p class="text-2xl font-bold">{{ truequeCount }}</p>
                    </div>
                </div>
            </div>

            <!-- Sección Usuarios -->
            <div id="usuarios-section" class="dashboard-section" [class.active]="activeSection === 'usuarios'">
                <h1><a name="Usuarios"></a>Usuarios Registrados</h1>
                
                <div class="bg-white p-4 rounded shadow">
                    <!-- Tabla de usuarios -->
                    <!-- Resto del contenido -->
                </div>
            </div>

            <!-- Sección Categorías -->
            <div id="categorias-section" class="dashboard-section" [class.active]="activeSection === 'categorias'">
                <h1><a name="Categorias"></a>Categorías</h1>
                
                <div class="bg-white p-4 rounded shadow">
                    <!-- Tabla de categorías -->
                    <!-- Resto del contenido -->
                </div>
            </div>

            <!-- Sección Productos -->
            <div id="productos-section" class="dashboard-section" [class.active]="activeSection === 'productos'">
                <h1><a name="Productos"></a>Productos Registrados</h1>
                
                <div class="bg-white p-4 rounded shadow">
                    <!-- Tabla de productos -->
                    <!-- Resto del contenido -->
                </div>
            </div>

            <!-- Sección Trueques -->
            <div id="trueques-section" class="dashboard-section" [class.active]="activeSection === 'trueques'">
                <h1><a name="Trueques"></a>Trueques</h1>
                
                <!-- Subsección de trueques pendientes -->
                <div class="bg-white p-4 rounded shadow mb-8" style="margin-bottom: 50px;">
                    <!-- Contenido de trueques pendientes -->
                </div>
                
                <!-- Subsección de trueques registrados -->
                <div class="bg-white p-4 rounded shadow" style="margin-bottom: 50px;">
                    <!-- Contenido de trueques registrados -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <app-edit-user *ngIf="showEditModal" [isOpen]="showEditModal" [userId]="selectedUserId"
        (close)="handleModalClose($event)">
    </app-edit-user>

    <app-edit-category *ngIf="showCategoryModal" [isOpen]="showCategoryModal" [categoryId]="selectedCategoryId"
        (close)="handleCategoryModalClose($event)">
    </app-edit-category>

    <app-edit-product *ngIf="showProductModal" [isOpen]="showProductModal" [productId]="selectedProductId"
        (close)="handleProductModalClose($event)">
    </app-edit-product>

    <app-edit-barter *ngIf="showBarterModal" [isOpen]="showBarterModal" [barterId]="selectedBarterId"
        (close)="handleBarterModalClose($event)">
    </app-edit-barter>

    <app-barter-details
        *ngIf="showBarterDetailsModal"
        [isOpen]="showBarterDetailsModal"
        [barterId]="selectedBarterDetailsId"
        [initialStatus]="selectedBarterStatus"
        (close)="handleBarterDetailsClose($event)"
    ></app-barter-details>
</body>

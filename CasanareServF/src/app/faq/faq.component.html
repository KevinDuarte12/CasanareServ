<app-header></app-header>
<app-navbar></app-navbar>
<app-breadcrumb></app-breadcrumb>
<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">Preguntas Frecuentes</h2>

    <!-- Categoría Productos -->
    <div class="category">
        <div class="category-title" (click)="toggleCategory('productos')">
            <h3>Productos</h3>
            <i class="fas fa-chevron-down" [class.active]="activeCategory === 'productos'"></i>
        </div>
        <div class="category-content" [class.active]="activeCategory === 'productos'">
            <div class="faq-item">
                <div class="question" (click)="toggleQuestion(0)">
                    ¿Cómo puedo publicar un producto?
                    <i class="fas fa-chevron-down" [class.active]="isQuestionActive(0)"></i>
                </div>
                <div class="answer" [class.active]="isQuestionActive(0)">
                    Para publicar un producto, debes registrarte y hacer clic en "Vender".
                </div>
            </div>
            <!-- Agrega más preguntas aquí siguiendo el mismo patrón -->
        </div>
    </div>

    <!-- Categoría Trueques -->
    <div class="category">
        <div class="category-title" (click)="toggleCategory('trueques')">
            <h3>Trueques</h3>
            <i class="fas fa-chevron-down" [class.active]="activeCategory === 'trueques'"></i>
        </div>
        <div class="category-content" [class.active]="activeCategory === 'trueques'">
            <div class="faq-item">
                <div class="question" (click)="toggleQuestion(0)">
                    ¿Cómo funciona el sistema de trueques?
                    <i class="fas fa-chevron-down" [class.active]="isQuestionActive(0)"></i>
                </div>
                <div class="answer" [class.active]="isQuestionActive(0)">
                    Puedes intercambiar productos con otros usuarios sin usar dinero.
                </div>
            </div>
            <!-- Agrega más preguntas aquí siguiendo el mismo patrón -->
        </div>
    </div>
</div>

<app-footer></app-footer>

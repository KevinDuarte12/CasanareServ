<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras | Casanare_Serv</title>
    <link rel="stylesheet" href="../carrito/carrito.component.css">
</head>
<body>
    <header>
        <h1>Casanare_Serv - Carrito de Compras</h1>
    </header>

    <section class="cart">
        <h2>Tu Carrito</h2>
        <div class="cart-item">
            <img src="img/caballo.jpg" alt="Producto">
            <div class="item-details">
                <h3>Nombre del Producto</h3>
                <p>Precio: $50.000</p>
                <input type="number" value="1" min="1">
                <button class="remove">Eliminar</button>
            </div>
        </div>
        <div class="cart-total">
            <h3>Total: $50.000</h3>
            <button class="checkout">Finalizar Compra</button>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="carrito-caruzel.js"></script>
</head>
<body>
    <header>
        <h1>Casanare_Serv - Carrito de Compras</h1>
    </header>

    <div class="container">
      <div id="mensaje-vacio" *ngIf="mensajeVacio">
        Tu carrito está vacío. Agrega un producto para continuar.
      </div>

      <div class="cart-container">
        <h2>TU CARRITO</h2>
        <div class="cart-quantity">Cantidad de Productos: <span>{{ cantidadProductos }}</span></div>
        <div class="cart-total">Total: <span>${{ totalPrecio }}</span></div>
        <button class="delete" (click)="eliminarProducto()" [disabled]="mensajeVacio">Eliminar Producto</button>
        <button class="checkout" [disabled]="mensajeVacio">Finalizar Compra</button>
      </div>
    </div>


    <section id="productos">
        <h2>Productos que te pueden gustar</h2>
        <div class="producto">
            <img src="manos_libres.jpg" alt="Manos Libres">
            <p>Manos Libres</p>
            <p>$ 20.000</p>
            <p>Disponibles: 5</p>
            <button class="agregar" data-precio="20000">Agregar</button>
        </div>
        <div class="producto">
            <img src="mouse.jpg" alt="Mouse">
            <p>Mouse</p>
            <p>$ 35.000</p>
            <p>Disponibles: 8</p>
            <button class="agregar" data-precio="35000">Agregar</button>
        </div>
    </section>
    <script src="carrito-caruzel.js"></script>
</body>
</html>

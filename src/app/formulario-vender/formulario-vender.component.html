<div class="form-container">
  <h2>Formulario Vender o Intercambiar</h2>

  <form>
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" placeholder="Ej. Celular en buen estado">

    <label for="descripcion">Descripción:</label>
    <textarea id="descripcion" placeholder="Describe el producto"></textarea>

    <label for="precio">Precio (opcional):</label>
    <input type="number" id="precio" placeholder="Ej. 50000">

    <label for="tipo">Tipo de transacción:</label>
    <select id="tipo">
      <option value="venta">Venta</option>
      <option value="intercambio">Intercambio</option>
    </select>
    <!--Campo oculto que aperece si se elige "intercambio"-->
    <div id="campoIntercambio" style="display: none;">
      <label for="productoIntercambio">Producto que deseas a cambio:</label>
      <input type="text" id="productoIntercambio" placeholder="eje. Calzado,Relog,etc..">
    </div>

    <button type="submit">Publicar</button>
  </form>
</div>
<app-footer></app-footer>


<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-blue-900 text-white p-5">
            <h2 class="text-xl font-bold mb-4">Admin</h2>
            <ul>
                <li class="mb-2 p-2 hover:bg-blue-700 rounded"><a href="#">Dashboard</a></li>
                <li class="mb-2 p-2 hover:bg-blue-700 rounded"><a href="#">Productos</a></li>
                <li class="mb-2 p-2 hover:bg-blue-700 rounded"><a href="#">Trueques</a></li>
            </ul>
        </aside>
        
        <!-- Contenido principal -->
        <main class="flex-1 p-6">
            <h1 class="text-2xl font-bold mb-4">Dashboard</h1>
            
            <!-- Tarjetas de estadísticas -->
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="text-lg font-semibold">Productos</h3>
                    <p class="text-2xl font-bold">150</p>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="text-lg font-semibold">Servicios</h3>
                    <p class="text-2xl font-bold">80</p>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="text-lg font-semibold">Trueques</h3>
                    <p class="text-2xl font-bold">45</p>
                </div>
            </div>
            
            <!-- Tabla de productos -->
            <div class="bg-white p-4 rounded shadow">
                <h3 class="text-lg font-semibold mb-4">Últimos productos</h3>
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-2 border">Nombre</th>
                            <th class="p-2 border">Categoría</th>
                            <th class="p-2 border">Precio</th>
                            <th class="p-2 border">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="p-2 border">Producto 1</td>
                            <td class="p-2 border">Electrónica</td>
                            <td class="p-2 border">$200</td>
                            <td class="p-2 border">
                                <button class="bg-green-500 text-white px-3 py-1 rounded">Editar</button>
                                <button class="bg-red-500 text-white px-3 py-1 rounded ml-2">Eliminar</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="p-2 border">Producto 2</td>
                            <td class="p-2 border">Ropa</td>
                            <td class="p-2 border">$50</td>
                            <td class="p-2 border">
                                <button class="bg-green-500 text-white px-3 py-1 rounded">Editar</button>
                                <button class="bg-red-500 text-white px-3 py-1 rounded ml-2">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>


<body class="dashboard">
    <div class="containerdashboard">
        <!-- Sidebar -->
        <aside>
            <h2 class="Admin">Admin</h2>
            <ul>
                <li>Dashboard</li>
                <li>Productos</li>
                <li>Trueques</li>
            </ul>
        </aside>

        <!-- Contenido principal -->
        <main>
            <h1>Dashboard</h1>

            <!-- Tarjetas de estadísticas -->
            <div class="stats">
                <div class="stat-card">
                    <h3>Productos</h3>
                    <p>150</p>
                </div>
                <div class="stat-card">
                    <h3>Servicios</h3>
                    <p>80</p>
                </div>
                <div class="stat-card">
                    <h3>Trueques</h3>
                    <p>45</p>
                </div>
            </div>

            <!-- Tabla de productos -->
            <div class="table-container">
                <h3>Últimos productos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Producto 1</td>
                            <td>Electrónica</td>
                            <td>$200</td>
                            <td>
                                <button class="edit">Editar</button>
                                <button class="delete">Eliminar</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Producto 2</td>
                            <td>Ropa</td>
                            <td>$50</td>
                            <td>
                                <button class="edit">Editar</button>
                                <button class="delete">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
